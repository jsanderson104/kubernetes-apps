# Install the CSI Driver before applying this manifest. curl -skSL https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/v4.13.4/deploy/install-driver.sh | bash -s v4.13.4 --
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: nfs-dynamic
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.1.44
  share: /mnt/kubernetes/cluster_mounts/nfsdata1
reclaimPolicy: Retain
allowVolumeExpansion: false
volumeBindingMode: Immediate
