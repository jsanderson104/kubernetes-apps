---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-deployment
  namespace: mariadb
  labels:
    app: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - containerPort: 3306
              name: mariadb
          env:
            # Note: For production, use Secrets instead of plaintext environment variables
            - name: MARIADB_ROOT_PASSWORD
              value: "keycloak"
            - name: MARIADB_DATABASE
              value: "keycloak"
            - name: MARIADB_USER
              value: "keycloak"
            - name: MARIADB_PASSWORD
              value: "keycloak"
          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            # Reusing your existing PVC
            claimName: mariadb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  namespace: mariadb
spec:
  type: LoadBalancer
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mariadb
